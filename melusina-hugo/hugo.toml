baseURL = 'https://hrbrlife.github.io/melusina-site/'
languageCode = 'en'
title = 'Melusina OS | Sovereign Web3 Superapp OS'
disableHugoGeneratorInject = true
canonifyURLs = false
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[languages]
  [languages.en]
    languageName = 'English'
    weight = 1
    title = 'Melusina OS | Sovereign Web3 Superapp OS'
  [languages.fr]
    languageName = 'Français'
    weight = 2
    title = 'Melusina OS | Système Souverain Web3 Superapp'

[params]
  description = "Melusina is a sovereign operating system for the Web3 & AI era. Run your apps, AI models, and workflows on infrastructure you control."
  author = "Hrbr.Life Ltd."
  ogImage = "/og-image.png"
  twitterHandle = "@melusina_os"
  siteName = "Melusina OS"
  domain = "melusina-os.org"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  page = "/:filename/"
