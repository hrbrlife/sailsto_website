# LLM Audit Configuration v3
# Generic Document Audit System - Optimized for Grok with 2M Context
# Pipeline: KB Loading → Mechanical Analysis → Master Summary → Per-Doc Summaries → Contextual Audits
#
# Anti-Hallucination Design:
# - All auditors receive relevant knowledge base context
# - Legal/factual assertions MUST include [SOURCE:filename#section] citations
# - SkepticAgent verifies citations against knowledge base
# - Findings with invalid citations are rejected

# Pipeline settings
parallel_auditors: true
max_parallel: 3
enable_skeptic: true
require_reviewer_approval: true
auto_pass_threshold: 0
critical_finding_blocks: true

# Knowledge Base settings
knowledge_base:
  # Path to knowledge base directory (relative to config or absolute)
  path: ${KNOWLEDGE_BASE_PATH:-../_schema/knowledge_base}
  # Whether to enable KB context injection for auditors
  enabled: true
  # Maximum lines to inject per source (0 = unlimited)
  max_lines_per_source: 500
  # Maximum total KB context lines (uses RAG selection if exceeded)
  max_total_context_lines: 3000
  # Topics to always include (empty = auto-select based on auditor)
  always_include_topics: []
  # Require [SOURCE:] citations for legal/factual assertions
  require_citations: true
  # Reject findings with invalid citations
  reject_invalid_citations: true

# Citation validation settings
citations:
  # Citation pattern: [SOURCE:filename#section] or [SOURCE:filename]
  pattern: '\[SOURCE:([^\]#]+)(?:#([^\]]+))?\]'
  # Minimum citations required per finding (0 = advisory only)
  min_per_finding: 1
  # Citation types that require validation
  validate_types:
    - legal
    - regulatory
    - compliance
  # Allow online search fallback if source not in KB
  allow_online_fallback: true

# Context strategy settings
context_strategy:
  # Master summary: feed ALL docs to create comprehensive overview
  master_summary_words: 3000
  # Per-doc summaries: rich contextual summaries
  per_doc_summary_words: 1000
  # Include full text of related docs (from DOC markers)
  include_full_related_docs: true
  # Include summaries of non-related docs
  include_summaries_of_others: true
  # Include master summary in all audits
  include_master_summary: true
  # Include regex validation results
  include_validation_results: true

# Default provider
default_provider: openrouter

# Default model - Grok Fast with 2M context
default_model: x-ai/grok-4-fast

# Online model - for web-enabled agents (verification, current regulations)
online_model: x-ai/grok-4-fast:online

# Provider configurations
providers:
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    
  openai:
    api_key: ${OPENAI_API_KEY}
  
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    
  local:
    base_url: http://localhost:8000/v1
    api_key: ${LOCAL_LLM_API_KEY}

# Agent configurations - OPTIMIZED FOR GROK 4's 2M CONTEXT
agents:
  # === Summary Generators ===
  master_summarizer:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.3
    max_tokens: 6000    # ~3000 words + structure
    timeout_seconds: 300  # Longer - processing ALL docs
    retry_count: 2
    
  summary_generator:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.3
    max_tokens: 2500    # ~1000 words + structure
    timeout_seconds: 180
    retry_count: 2

  # === Parallel Auditors - DOUBLED OUTPUT TOKENS ===
  legal_auditor:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 8000    # Detailed findings with evidence
    timeout_seconds: 240
    retry_count: 2
    
  compliance_auditor:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 8000
    timeout_seconds: 240
    retry_count: 2
    
  technical_auditor:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.0
    max_tokens: 8000
    timeout_seconds: 240
    retry_count: 2
    
  financial_auditor:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 8000
    timeout_seconds: 240
    retry_count: 2
    
  data_privacy_auditor:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 8000
    timeout_seconds: 240
    retry_count: 2
    
  operational_auditor:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 8000
    timeout_seconds: 240
    retry_count: 2

  # === Pipeline Agents - INCREASED FOR SYNTHESIS ===
  consolidator:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 12000   # Synthesizing 6 agent outputs with full context
    timeout_seconds: 300
    retry_count: 2
    
  skeptic:
    enabled: true
    # Online model for real-time verification of citations
    model: x-ai/grok-4-fast:online
    use_online_model: true
    temperature: 0.2
    max_tokens: 10000   # Thorough challenge analysis + citation verification
    timeout_seconds: 300
    retry_count: 2
    # Skeptic-specific settings
    verify_citations: true
    reject_invalid_citations: true
    online_search_timeout: 30
    
  reviewer:
    enabled: true
    model: x-ai/grok-4-fast
    temperature: 0.1
    max_tokens: 10000   # Final comprehensive decision with all findings
    timeout_seconds: 300
    retry_count: 2
    # Reviewer tracks citation validation stats
    include_citation_stats: true

# Output configuration
output:
  # Include citation validation in reports
  include_citation_validation: true
  # Include KB sources used in audit
  include_kb_sources: true
  # Flag potentially hallucinated findings
  flag_unverified_findings: true
