baseURL = 'https://sails.to/'
languageCode = 'en'
title = 'Sails.to | Hybrid Securities Infrastructure'
disableHugoGeneratorInject = true
canonifyURLs = false
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[languages]
  [languages.en]
    languageName = 'English'
    weight = 1
    title = 'Sails.to | Hybrid Securities Infrastructure'
  [languages.fr]
    languageName = 'Français'
    weight = 2
    title = 'Sails.to | Infrastructure de Titres Hybrides'

[params]
  description = "Hybrid securities infrastructure bridging DeFi innovation with TradFi trust"
  author = "Sails.to DAO LLC"
  ogImage = "/og-image.png"
  twitterHandle = "@sailsto"
  siteName = "Sails.to"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

# Disable empty taxonomy pages from being generated
[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown

# Permalinks for top-level pages only
[[permalinks]]
page = "/:filename.html"

