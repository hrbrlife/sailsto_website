<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{ partial "head.html" . }}
<body>
    {{ if not .Params.hideNav }}
    {{ partial "nav.html" . }}
    {{ end }}
    
    {{ block "main" . }}{{ end }}
    
    {{ if not .Params.hideFooter }}
    {{ partial "footer.html" . }}
    {{ end }}
    
    {{ block "scripts" . }}{{ end }}
</body>
</html>
