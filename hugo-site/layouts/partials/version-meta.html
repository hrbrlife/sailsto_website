{{/*
  Partial: version-meta
  Injects site version meta tags for cache busting verification.
  Data source: data/version.json (generated by deploy.sh before each build)
*/}}
{{ with .Site.Data.version }}
<meta name="x-site-version" content="{{ .hashShort }}">
<meta name="x-build-date" content="{{ .date }}">
{{ end }}
