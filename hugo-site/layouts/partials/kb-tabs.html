{{/* 
  Partial: kb-tabs.html
  Renders content type tab buttons from data/categories.yaml.
  
  Accepts a dict with:
    .lang       — "en" or "fr"
    .categories — site.Data.categories
*/}}

{{ $lang := .lang }}
{{ $cats := .categories }}

<div class="kb-tabs" id="kb-tabs">
    {{ range $key, $def := $cats.content_types }}
    <button class="kb-tab{{ if eq $key "all" }} active{{ end }}" data-category="{{ $key }}">{{ index $def $lang }}</button>
    {{ end }}
</div>
